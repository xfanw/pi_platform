{% extends "core/base.html" %}
{% block title %}Sign Up | PI Platform{% endblock %}
{% block body_bare %}
<div class="login-wrap">
  <div class="login-brand">FII USA | Physical Inventory</div>
  <div class="card login-card">
    <h1>Sign Up</h1>
    <p class="page-sub">Create a new PI Platform account.</p>
    <form method="post" class="stack-form">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" name="username" autocomplete="username" autofocus required>
      <label for="id_password">Password</label>
      <input id="id_password" type="password" name="password" autocomplete="current-password" required>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class='btn btn-sm btn-primary' type="submit">Sign Up</button>
    </form>
    <div class='text-center mt-2'><a href="{% url 'core:login' %}">click here to log in</a></div>
  </div>
</div>
{% endblock %}
